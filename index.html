<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト・勤怠管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#f4f4f2;color:#1a1a18;font-size:14px}
.app{max-width:1280px;margin:0 auto;padding:1rem 1rem 4rem}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:10px}
.title{font-size:20px;font-weight:700}
.sync-bar{display:flex;gap:8px;align-items:center}
.btn{border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px;border:0.5px solid #ccc;background:#fff}
.btn:hover{background:#f0f0ee}
.btn.green{border-color:#5DCAA5;color:#085041}
.btn.blue{border-color:#85B7EB;color:#0C447C}
.badge{font-size:11px;padding:3px 10px;border-radius:20px;background:#dff2d4;color:#27500A;border:0.5px solid #97C459}
.tabs{display:flex;gap:0;margin-bottom:1.25rem;border-bottom:1.5px solid #e0e0dc}
.tab{padding:9px 20px;font-size:13px;font-weight:500;cursor:pointer;color:#888;border-bottom:2px solid transparent;margin-bottom:-1.5px;background:none;border-top:none;border-left:none;border-right:none}
.tab.active{color:#1a1a18;border-bottom-color:#1a1a18;font-weight:700}
.tab-panel{display:none}.tab-panel.active{display:block}
.card{background:#fff;border-radius:12px;border:0.5px solid #e0e0dc;overflow:hidden;margin-bottom:1rem}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.month-label{font-size:15px;font-weight:700;min-width:110px;text-align:center}
.legend{display:flex;gap:14px;margin-bottom:1.25rem;flex-wrap:wrap;align-items:center;background:#fff;border-radius:10px;padding:9px 14px;border:0.5px solid #e0e0dc}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#555}
.legend-dot{width:12px;height:12px;border-radius:3px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{font-size:11px;font-weight:600;color:#888;padding:7px 4px;text-align:center;border-bottom:0.5px solid #eee;white-space:nowrap;background:#fafaf8}
thead th.emp-col{text-align:left;min-width:100px;position:sticky;left:0;background:#fafaf8;z-index:3;padding-left:12px}
th.sun{color:#C0392B}th.sat{color:#185FA5}th.hol{color:#C0392B}th.today-h{background:#eef5fd}
tbody tr{border-bottom:0.5px solid #f0f0ec}
tbody tr:hover{background:#fafaf8}
td{padding:5px 4px;text-align:center;vertical-align:middle}
td.emp-cell{text-align:left;padding:6px 8px 6px 12px;position:sticky;left:0;background:#fff;z-index:1;border-right:0.5px solid #ececea}
tbody tr:hover td.emp-cell{background:#fafaf8}
td.today-col{background:#eef5fd}
.emp-row{display:flex;align-items:center;gap:8px}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.emp-name{font-size:13px;font-weight:500;white-space:nowrap}
.badge-w{display:inline-block;padding:3px 6px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;min-width:28px;background:#dceefb;color:#0C447C}
.badge-o{display:inline-block;padding:3px 6px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;min-width:28px;background:#f0f0ee;color:#999;border:0.5px dashed #ccc}
.badge-p{display:inline-block;padding:3px 6px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;min-width:28px;background:#d4f0e6;color:#085041}
.sum-row td{font-size:11px;color:#888;padding:5px 4px;background:#fafaf8;border-top:0.5px solid #eee}
.sum-row td.emp-cell{font-weight:600;background:#fafaf8}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:200;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:1.5rem;min-width:240px;max-width:360px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.14)}
.modal-ttl{font-size:15px;font-weight:700;margin-bottom:1rem}
.opt-btn{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:0.5px solid #ddd;margin-bottom:8px}
.opt-w{background:#dceefb;color:#0C447C}
.opt-o{background:#f0f0ee;color:#555}
.opt-p{background:#d4f0e6;color:#085041}
.cancel-btn{width:100%;padding:9px;border:0.5px solid #ccc;border-radius:8px;background:none;cursor:pointer;font-size:13px;color:#666;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:1rem}
.stat-card{background:#fff;border-radius:10px;padding:12px 16px;border:0.5px solid #e0e0dc}
.stat-label{font-size:11px;color:#888;margin-bottom:4px}
.stat-value{font-size:22px;font-weight:700}
/* 勤怠 */
.att-select{border:0.5px solid #ccc;border-radius:8px;padding:6px 10px;font-size:13px;background:#fff;cursor:pointer}
.time-input{width:72px;border:0.5px solid #ccc;border-radius:6px;padding:4px 6px;font-size:12px;text-align:center;background:#fff}
.time-input:focus{outline:none;border-color:#85B7EB}
.att-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600}
.ab-normal{background:#dceefb;color:#0C447C}
.ab-late{background:#fde4e4;color:#7A1F1F}
.ab-absent{background:#f0f0ee;color:#888}
.ab-overtime{background:#fdf3d4;color:#5a3e00}
.ab-paid{background:#d4f0e6;color:#085041}
.missing{background:#fff8e1;border-radius:6px;padding:3px 6px;font-size:11px;color:#b45309;border:1px dashed #f59e0b;display:inline-block;min-width:72px;text-align:center;cursor:pointer}
/* 給与 */
.payroll-table{width:100%;border-collapse:collapse;font-size:12px}
.payroll-table th{font-size:11px;font-weight:600;color:#888;padding:9px 12px;text-align:left;border-bottom:0.5px solid #eee;background:#fafaf8}
.payroll-table th.num{text-align:right}
.payroll-table td{padding:10px 12px;border-bottom:0.5px solid #f0f0ec}
.payroll-table td.num{text-align:right}
.ot-val{color:#633806;font-weight:700}
.payroll-note{font-size:11px;color:#888;margin-top:8px;padding:8px 12px;background:#fafaf8;border-radius:8px}
/* 印刷用 */
.print-table{width:100%;border-collapse:collapse;font-size:11px}
.print-table th{padding:6px 3px;text-align:center;border:1px solid #ddd;background:#fafaf8;font-size:10px;font-weight:600;color:#555;white-space:nowrap}
.print-table th.pt-name{text-align:left;min-width:80px;padding-left:8px;background:#f0f0ee}
.print-table td{padding:5px 3px;text-align:center;border:1px solid #eee}
.print-table td.pt-name{text-align:left;padding:5px 8px;background:#fafaf8;border-right:1px solid #ddd;border-left:4px solid var(--ec)}
.pt-sun{background:#fff5f5;color:#C0392B}
.pt-sat{background:#f0f5ff;color:#185FA5}
.pt-today{background:#eef5fd}
.pt-w{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:4px;font-size:10px;font-weight:700}
.pt-o{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:4px;background:#f5f5f3;color:#bbb;font-size:10px}
.pt-p{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:4px;background:#d4f0e6;color:#085041;font-size:10px;font-weight:700}
.print-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:1.25rem}
.psc{border:0.5px solid #e0e0dc;border-radius:8px;padding:8px 12px;text-align:center}
.psc-name{font-size:11px;font-weight:600;margin-bottom:4px;border-bottom:0.5px solid #eee;padding-bottom:4px}
.psc-row{display:flex;justify-content:space-between;font-size:10px;color:#555;margin-top:3px}
.psc-val{font-weight:700;color:#0C447C}
/* メモ */
.memo-wrap{background:#fff;border-radius:12px;border:0.5px solid #e0e0dc;padding:1.25rem;margin-top:1rem}
.memo-title{font-size:13px;font-weight:600;margin-bottom:8px}
.memo-textarea{width:100%;min-height:120px;border:0.5px solid #ddd;border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;resize:vertical;line-height:1.7;background:#fafaf8}
.memo-textarea:focus{outline:none;border-color:#85B7EB;background:#fff}
.memo-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.memo-saved{font-size:11px;color:#888}
.memo-saved.ok{color:#085041}
/* Sheets連携 */
.sheets-section{background:#fff;border-radius:12px;border:0.5px solid #e0e0dc;padding:1.25rem;margin-bottom:1rem}
.sheets-input{width:100%;border:0.5px solid #ccc;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:8px;background:#fff}
.sheets-status{font-size:12px;margin-top:8px;padding:6px 10px;border-radius:6px;display:none}
.sheets-status.ok{background:#d4f0e6;color:#085041;display:block}
.sheets-status.err{background:#fde4e4;color:#7A1F1F;display:block}
@media print{
  .header,.tabs,.controls,.legend,.stats,.memo-wrap,.sheets-section{display:none!important}
  .tab-panel{display:none!important}
  #tab-print{display:block!important}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="title">シフト・勤怠管理</span>
      <span class="badge" id="sync-badge">● 同期済み</span>
    </div>
    <div class="sync-bar">
      <button class="btn green" id="btn-save">☁ 保存</button>
      <button class="btn green" id="btn-load">☁ 取得</button>
      <button class="btn blue" onclick="exportJSON()">書き出し</button>
      <button class="btn" onclick="document.getElementById('imp').click()">読み込み</button>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="importJSON(event)">
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('shift',this)">シフト管理</button>
    <button class="tab" onclick="showTab('attend',this)">勤怠管理</button>
    <button class="tab" onclick="showTab('payroll',this)">給与計算</button>
    <button class="tab" onclick="showTab('print',this)">印刷用</button>
    <button class="tab" onclick="showTab('sheets',this)">Sheets連携</button>
  </div>

  <!-- シフト管理 -->
  <div id="tab-shift" class="tab-panel active">
    <div class="controls">
      <button class="btn" onclick="openFixedModal()">固定休を設定 ⚙</button>
      <button class="btn green" onclick="openPaidModal()">有休集計 ▸</button>
      <button class="btn" onclick="chMonth(-1)">← 前月</button>
      <span class="month-label" id="shift-label"></span>
      <button class="btn" onclick="chMonth(1)">次月 →</button>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#dceefb;border:1px solid #85B7EB"></div>出勤</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f0f0ee;border:0.5px dashed #ccc"></div>休</div>
      <div class="legend-item"><div class="legend-dot" style="background:#d4f0e6;border:1px solid #5DCAA5"></div>有休</div>
      <div class="legend-item" style="font-size:11px;color:#C0392B">■ 日曜・祝日</div>
      <div class="legend-item" style="font-size:11px;color:#185FA5">■ 土曜</div>
    </div>
    <div class="card"><div class="table-wrap">
      <table><thead><tr id="shift-hdr"></tr></thead><tbody id="shift-body"></tbody></table>
    </div></div>
    <div class="stats" id="shift-stats"></div>
  </div>

  <!-- 勤怠管理 -->
  <div id="tab-attend" class="tab-panel">
    <div class="controls">
      <select class="att-select" id="att-emp" onchange="renderAttend()">
        <option value="all">全スタッフ</option>
      </select>
      <button class="btn" onclick="chAttMonth(-1)">← 前月</button>
      <span class="month-label" id="attend-label"></span>
      <button class="btn" onclick="chAttMonth(1)">次月 →</button>
    </div>
    <div class="stats" id="attend-stats"></div>
    <div class="card"><div class="table-wrap">
      <table><thead><tr id="attend-hdr"></tr></thead><tbody id="attend-body"></tbody></table>
    </div></div>
  </div>

  <!-- 給与計算 -->
  <div id="tab-payroll" class="tab-panel">
    <div class="controls">
      <button class="btn" onclick="chPayMonth(-1)">← 前月</button>
      <span class="month-label" id="payroll-label"></span>
      <button class="btn" onclick="chPayMonth(1)">次月 →</button>
      <span style="font-size:12px;color:#888">給与期間：前月16日〜当月15日</span>
    </div>
    <div id="payroll-period-bar" style="background:#e8f2fc;border:1px solid #85B7EB;border-radius:10px;padding:10px 16px;margin-bottom:1rem;font-size:13px;color:#0C447C;font-weight:600"></div>
    <div class="card"><div class="table-wrap">
      <table class="payroll-table">
        <thead><tr>
          <th>氏名</th>
          <th class="num">出勤予定</th>
          <th class="num">出勤実績</th>
          <th class="num">有休</th>
          <th class="num">欠勤</th>
          <th class="num">みなし残業</th>
          <th class="num">追加残業</th>
          <th class="num">所定労働時間</th>
          <th class="num">実残業時間</th>
          <th class="num">総勤務時間</th>
          <th class="num">遅刻</th>
        </tr></thead>
        <tbody id="payroll-body"></tbody>
      </table>
    </div></div>
    <div class="payroll-note" id="payroll-note"></div>
    <div class="memo-wrap">
      <div class="memo-title">📝 メモ <span id="memo-period" style="font-size:11px;color:#888;font-weight:400"></span></div>
      <textarea class="memo-textarea" id="memo-area" placeholder="交通費の変更、特記事項などを記録..."></textarea>
      <div class="memo-footer">
        <div class="memo-saved" id="memo-saved"></div>
        <button class="btn" onclick="clearMemo()" style="font-size:12px;color:#888">消去</button>
      </div>
    </div>
  </div>

  <!-- 印刷用 -->
  <div id="tab-print" class="tab-panel">
    <div class="controls">
      <button class="btn" onclick="chPrintMonth(-1)">← 前月</button>
      <span class="month-label" id="print-label"></span>
      <button class="btn" onclick="chPrintMonth(1)">次月 →</button>
      <button class="btn" style="background:#1a1a18;color:#fff;border-color:#1a1a18" onclick="window.print()">🖨 印刷</button>
    </div>
    <div class="card" style="padding:1.5rem">
      <div id="print-area"></div>
    </div>
  </div>

  <!-- Sheets連携 -->
  <div id="tab-sheets" class="tab-panel">
    <div class="sheets-section">
      <div style="font-size:15px;font-weight:700;margin-bottom:4px">Googleスプレッドシート連携</div>
      <div style="font-size:12px;color:#888;margin-bottom:1rem">Apps ScriptのURLを設定してください</div>
      <input type="text" class="sheets-input" id="sheets-url-input" placeholder="https://script.google.com/macros/s/xxxxx/exec">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn blue" onclick="saveURL()">URLを保存</button>
        <button class="btn green" onclick="syncFromSheets()">打刻データを取得 ↓</button>
      </div>
      <div class="sheets-status" id="sheets-status"></div>
    </div>
  </div>
</div>

<!-- シフト編集モーダル -->
<div class="modal-overlay" id="shift-modal">
  <div class="modal">
    <div class="modal-ttl" id="shift-modal-ttl">シフトを選択</div>
    <button class="opt-btn opt-w" onclick="applyShift('w')">出勤</button>
    <button class="opt-btn opt-o" onclick="applyShift('o')">休</button>
    <button class="opt-btn opt-p" onclick="applyShift('p')">有休</button>
    <button class="cancel-btn" onclick="closeShiftModal()">キャンセル</button>
  </div>
</div>

<!-- 固定休モーダル -->
<div class="modal-overlay" id="fixed-modal">
  <div class="modal" style="max-width:540px;max-height:90vh;overflow-y:auto">
    <div class="modal-ttl">固定休曜日の設定</div>
    <div style="font-size:12px;color:#888;margin-bottom:1rem">定休日を選択（複数可）。変更なければ翌月以降も継続。</div>
    <div id="fixed-rows"></div>
    <button class="btn blue" style="width:100%;padding:10px;margin-top:1rem" onclick="applyFixed()">この月に一括反映</button>
    <div class="memo-saved" id="fixed-notice" style="margin-top:8px;text-align:center"></div>
    <button class="cancel-btn" onclick="closeFixedModal()">閉じる</button>
  </div>
</div>

<!-- 有休集計モーダル -->
<div class="modal-overlay" id="paid-modal">
  <div class="modal" style="max-width:480px">
    <div class="modal-ttl">有休取得数の集計</div>
    <div style="display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center">
      <span style="font-size:13px;color:#666">開始</span>
      <select class="att-select" id="paid-fy"></select><span>年</span>
      <select class="att-select" id="paid-fm"></select><span>月</span>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center">
      <span style="font-size:13px;color:#666">終了</span>
      <select class="att-select" id="paid-ty"></select><span>年</span>
      <select class="att-select" id="paid-tm"></select><span>月</span>
      <button class="btn blue" onclick="calcPaid()">集計</button>
    </div>
    <div id="paid-result"></div>
    <button class="cancel-btn" style="margin-top:1rem" onclick="closePaidModal()">閉じる</button>
  </div>
</div>

<script>
// ===== 定数 =====
const EMPS=[
  {id:1,name:'水野',      bg:'#dceefb',tc:'#0C447C',part:false},
  {id:2,name:'千葉',      bg:'#d4f0e6',tc:'#085041',part:false},
  {id:3,name:'水谷',      bg:'#e8e4f8',tc:'#3C3489',part:false},
  {id:4,name:'田中（彩）',bg:'#fde8d8',tc:'#633806',part:false},
  {id:5,name:'石川',      bg:'#fde4e4',tc:'#7A1F1F',part:false},
  {id:6,name:'桂田',      bg:'#e8d4f0',tc:'#4A0C7C',part:false},
  {id:7,name:'大西',      bg:'#dff2d4',tc:'#27500A',part:true,startH:'08:30',endH:'13:00',workH:4.5},
  {id:8,name:'田中（菜）',bg:'#fdf3d4',tc:'#5a3e00',part:true,startH:'09:00',endH:'13:00',workH:4},
];
const DOW=['日','月','火','水','木','金','土'];
// 祝日
const HOLIDAYS=new Set(['2025-01-01','2025-01-13','2025-02-11','2025-02-23','2025-02-24','2025-03-20','2025-04-29','2025-05-03','2025-05-04','2025-05-05','2025-05-06','2025-07-21','2025-08-11','2025-09-15','2025-09-21','2025-09-22','2025-09-23','2025-10-13','2025-11-03','2025-11-23','2025-11-24','2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06','2026-07-20','2026-08-11','2026-09-21','2026-09-22','2026-09-23','2026-10-12','2026-11-03','2026-11-23','2026-12-23','2027-01-01','2027-01-11','2027-02-11','2027-02-23','2027-03-20','2027-04-29','2027-05-03','2027-05-04','2027-05-05','2027-07-19','2027-08-11','2027-09-20','2027-09-23','2027-10-11','2027-11-03','2027-11-23']);

const TODAY=new Date();
const STORE_KEY='shift_mgr_v1';

// ===== データ構造（新設計）=====
// shifts: { "2026_8": { "1": {1:'w',2:'o',...}, "2": {1:'w',...} } }  empId -> day -> status
// attend: { "2026_8_1_1": {in:'09:00',out:'19:30',manual:{in:false,out:false}} }  year_month_day_empId
// fixed:  { "1": [0,6], "2": [0,6], ... }  empId -> dow array
// memos:  { "2026_8": "メモ内容" }
let shifts={}, attend={}, fixed={}, memos={}, sheetsUrl='https://script.google.com/macros/s/AKfycbxrq_407tiWTbOccQkX4ZOTG6ZRWO9UHeQlYoUU5pzw4MvI6p8TVmuXfp7F9-cBm-ce/exec';

// ===== ユーティリティ =====
function pad2(n){return String(n).padStart(2,'0')}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function dateKey(y,m,d){return y+'-'+pad2(m+1)+'-'+pad2(d)}
function isHol(y,m,d){return new Date(y,m,d).getDay()===0||HOLIDAYS.has(dateKey(y,m,d))}
function isSat(y,m,d){return new Date(y,m,d).getDay()===6}
function timeToMin(t){if(!t||!t.includes(':'))return null;const[h,m]=t.split(':').map(Number);return h*60+m}
function ini(e){return e.name.slice(0,2)}
function mk(y,m){return y+'_'+m}
function attKey(y,m,d,eid){return y+'_'+m+'_'+d+'_'+eid}

// ===== 月キーのシフト初期化 =====
function initMonthIfNeeded(y,m){
  const key=mk(y,m);
  if(shifts[key])return;
  shifts[key]={};
  const days=daysInMonth(y,m);
  const startDow=new Date(y,m,1).getDay();
  EMPS.forEach(function(emp){
    const empData={};
    for(let d=1;d<=days;d++){
      const dow=(startDow+d-1)%7;
      const fixedDows=fixed[emp.id]||[0,6];
      empData[d]=fixedDows.includes(dow)?'o':'w';
    }
    shifts[key][emp.id]=empData;
  });
}

function getShift(y,m,d,eid){
  initMonthIfNeeded(y,m);
  return (shifts[mk(y,m)][eid]||{})[d]||'o';
}
function setShift(y,m,d,eid,val){
  initMonthIfNeeded(y,m);
  if(!shifts[mk(y,m)][eid])shifts[mk(y,m)][eid]={};
  shifts[mk(y,m)][eid][d]=val;
  scheduleSave();
}

// ===== ローカル保存 =====
let saveTimer=null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(localSave,500);
}
function localSave(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify({shifts,attend,fixed,memos,sheetsUrl}));}catch(e){}
}
function localLoad(){
  try{
    const d=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');
    if(d.shifts)shifts=d.shifts;
    if(d.attend)attend=d.attend;
    if(d.fixed){EMPS.forEach(function(e){if(d.fixed[e.id]!==undefined)fixed[e.id]=d.fixed[e.id];});}
    if(d.memos)memos=d.memos;
    if(d.sheetsUrl)sheetsUrl=d.sheetsUrl;
  }catch(e){}
}

// ===== クラウド保存・取得 =====
let cloudTimer=null;
function scheduleCloud(){
  if(!sheetsUrl)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(cloudSave,2000);
}

async function cloudSave(){
  if(!sheetsUrl)return;
  setBadge('☁ 保存中...','#dceefb','#0C447C');
  try{
    const payload=JSON.stringify({shifts,attend,fixed,memos});
    const chunkSize=80;
    const chunks=[];
    for(let i=0;i<payload.length;i+=chunkSize)chunks.push(payload.slice(i,i+chunkSize));
    for(let i=0;i<chunks.length;i++){
      await fetch(sheetsUrl+'?action=save&idx='+i+'&chunk='+encodeURIComponent(chunks[i]),{credentials:'omit'});
    }
    setBadge('● 同期済み','#dff2d4','#27500A');
  }catch(e){setBadge('⚠ 保存失敗','#fde4e4','#7A1F1F');}
}

async function cloudLoad(){
  if(!sheetsUrl)return false;
  setBadge('☁ 取得中...','#dceefb','#0C447C');
  try{
    const res=await fetch(sheetsUrl+'?action=load&t='+Date.now(),{credentials:'omit'});
    const text=await res.text();
    if(!text||text.trim().startsWith('<')){setBadge('● 同期済み','#dff2d4','#27500A');return false;}
    const d=JSON.parse(text);
    if(!d||!d.shifts){setBadge('● 同期済み','#dff2d4','#27500A');return false;}
    if(d.shifts)shifts=d.shifts;
    if(d.attend)attend=d.attend;
    if(d.fixed){EMPS.forEach(function(e){if(d.fixed[e.id]!==undefined)fixed[e.id]=d.fixed[e.id];});}
    if(d.memos)memos=d.memos;
    localSave();
    setBadge('● 同期済み','#dff2d4','#27500A');
    return true;
  }catch(e){setBadge('⚠ 取得失敗','#fde4e4','#7A1F1F');return false;}
}

function setBadge(text,bg,color){
  const b=document.getElementById('sync-badge');

// ===== エクスポート・インポート =====
function exportJSON(){
  const blob=new Blob([JSON.stringify({shifts,attend,fixed,memos})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='shift_backup_'+TODAY.getFullYear()+pad2(TODAY.getMonth()+1)+'.json';a.click();
}
function importJSON(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=function(e){
    try{
      const d=JSON.parse(e.target.result);
      if(d.shifts)shifts=d.shifts;
      if(d.attend)attend=d.attend;
      if(d.fixed){EMPS.forEach(function(emp){if(d.fixed[emp.id]!==undefined)fixed[emp.id]=d.fixed[emp.id];});}
      if(d.memos)memos=d.memos;
      // 旧形式からの移行
      if(d.shifts&&typeof Object.values(d.shifts)[0]==='string'){
        // 旧形式: shifts['1_2026_8_1']='w' → 新形式に変換
        const newShifts={};
        Object.keys(d.shifts).forEach(function(k){
          const p=k.split('_');
          const eid=parseInt(p[0]),y=parseInt(p[1]),m=parseInt(p[2]),day=parseInt(p[3]);
          const mk2=y+'_'+m;
          if(!newShifts[mk2])newShifts[mk2]={};
          if(!newShifts[mk2][eid])newShifts[mk2][eid]={};
          newShifts[mk2][eid][day]=d.shifts[k]==='paid'?'p':d.shifts[k]==='work'?'w':'o';
        });
        shifts=newShifts;
      }
      // 旧attend形式の変換
      if(d.attendance){
        Object.keys(d.attendance).forEach(function(k){
          const p=k.replace(/^a_/,'').split('_');
          if(p.length===4){
            const newKey=p[0]+'_'+p[1]+'_'+p[2]+'_'+p[3];
            attend[newKey]=d.attendance[k];
          }
        });
      }
      localSave();
      renderAll();
      alert('読み込みました');
    }catch(err){alert('読み込みエラー:'+err.message);}
  };
  r.readAsText(f);ev.target.value='';
}

let sY=TODAY.getFullYear(),sM=TODAY.getMonth();
function chMonth(d){sM+=d;if(sM<0){sM=11;sY--;}if(sM>11){sM=0;sY++;}renderShift();}

function renderShift(){
  initMonthIfNeeded(sY,sM);
  const days=daysInMonth(sY,sM);
  const startDow=new Date(sY,sM,1).getDay();
  const isCurr=sY===TODAY.getFullYear()&&sM===TODAY.getMonth();
  document.getElementById('shift-label').textContent=sY+'年'+(sM+1)+'月';

  let hdr='<th class="emp-col">氏名</th>';
  for(let d=1;d<=days;d++){
    const dow=(startDow+d-1)%7;
    const isT=isCurr&&d===TODAY.getDate();
    const cls=isT?'today-h':isHol(sY,sM,d)?'hol':isSat(sY,sM,d)?'sat':'';
    const dowStr=isHol(sY,sM,d)&&dow!==0?DOW[dow]+'<br><span style="font-size:8px">祝</span>':DOW[dow];
    hdr+=`<th${cls?' class="'+cls+'"':''}>${d}<br><span style="font-size:9px">${dowStr}</span></th>`;
  }
  hdr+='<th style="min-width:54px">集計</th>';
  document.getElementById('shift-hdr').innerHTML=hdr;

  const dayCnt=Array(days+1).fill(0);
  let rows='';
  EMPS.forEach(function(emp){
    let wk=0,pd=0,cells='';
    for(let d=1;d<=days;d++){
      const s=getShift(sY,sM,d,emp.id);
      const isT=isCurr&&d===TODAY.getDate();
      const tdCls=isT?'today-col':'';
      if(s==='w'){wk++;dayCnt[d]++;}
      if(s==='p')pd++;
      const badge=s==='w'?`<span class="badge-w" onclick="openShiftModal(${emp.id},${d})">出</span>`:
                  s==='p'?`<span class="badge-p" onclick="openShiftModal(${emp.id},${d})">有</span>`:
                          `<span class="badge-o" onclick="openShiftModal(${emp.id},${d})">休</span>`;
      cells+=`<td${tdCls?' class="'+tdCls+'"':''}>${badge}</td>`;
    }
    rows+=`<tr><td class="emp-cell"><div class="emp-row">
      <div class="avatar" style="background:${emp.bg};color:${emp.tc}">${ini(emp)}</div>
      <span class="emp-name">${emp.name}${emp.part?'<span style="font-size:9px;color:#888;margin-left:3px">P</span>':''}</span>
    </div></td>${cells}<td style="font-size:11px;color:#888">出${wk} 有${pd}</td></tr>`;
  });
  let sumRow='<tr class="sum-row"><td class="emp-cell">人数/日</td>';
  for(let d=1;d<=days;d++){
    const isT=isCurr&&d===TODAY.getDate();
    sumRow+=`<td${isT?' class="today-col"':''}><span style="font-size:11px">${dayCnt[d]}</span></td>`;
  }
  sumRow+='<td></td></tr>';
  document.getElementById('shift-body').innerHTML=rows+sumRow;

  let tot=0,paid=0,off=0;
  EMPS.forEach(function(emp){
    for(let d=1;d<=days;d++){const s=getShift(sY,sM,d,emp.id);if(s==='w')tot++;else if(s==='p')paid++;else off++;}
  });
  document.getElementById('shift-stats').innerHTML=
    `<div class="stat-card"><div class="stat-label">月の総出勤数</div><div class="stat-value">${tot}</div></div>
     <div class="stat-card"><div class="stat-label">有休取得</div><div class="stat-value" style="color:#0F6E56">${paid}</div></div>
     <div class="stat-card"><div class="stat-label">休日</div><div class="stat-value" style="color:#aaa">${off}</div></div>
     <div class="stat-card"><div class="stat-label">平均出勤/人</div><div class="stat-value">${Math.round(tot/EMPS.length)}</div></div>`;
}

// ===== 勤怠管理 =====
let aY=TODAY.getFullYear(),aM=TODAY.getMonth();
function chAttMonth(d){aM+=d;if(aM<0){aM=11;aY--;}if(aM>11){aM=0;aY++;}renderAttend();}

function getRule(y,m,d,emp){
  if(emp.part)return{startH:emp.startH,endH:emp.endH,breakMin:0,workH:emp.workH,part:true};
  const isH=isHol(y,m,d);
  return{startH:'08:30',prescribedStart:'09:00',endH:isH?'18:30':'19:30',prescribedEnd:isH?'18:00':'19:00',breakMin:120,workH:isH?7:8,part:false};
}
function calcWork(y,m,d,emp,att){
  const rule=getRule(y,m,d,emp);
  const inMin=timeToMin(att.in),outMin=timeToMin(att.out);
  if(inMin===null||outMin===null)return{worked:0,extraOT:0};
  const fixIn=Math.max(inMin,timeToMin(rule.startH));
  const gross=outMin-fixIn-rule.breakMin;
  const worked=Math.max(0,gross);
  const extraOT=rule.part?0:Math.max(0,outMin-timeToMin(rule.endH));
  return{worked,extraOT};
}
function getStatus(y,m,d,emp,s,att){
  if(s==='o')return'off';if(s==='p')return'paid';
  if(!att||(!att.in&&!att.out))return'absent';
  const rule=getRule(y,m,d,emp);
  const inMin=timeToMin(att.in);
  const lateBase=timeToMin(rule.startH);
  const isLate=inMin!==null&&inMin>lateBase+1;
  const{extraOT}=calcWork(y,m,d,emp,att);
  if(!rule.part&&extraOT>0)return'overtime';
  if(isLate)return'late';
  return'normal';
}
function statusBadge(st){
  const map={normal:['ab-normal','正常'],late:['ab-late','遅刻'],absent:['ab-absent','欠勤'],overtime:['ab-overtime','残業'],paid:['ab-paid','有休'],off:['','']};
  const r=map[st]||['',''];
  return r[1]?`<span class="att-badge ${r[0]}">${r[1]}</span>`:'';
}

  document.getElementById('attend-label').textContent=aY+'年'+(aM+1)+'月';

  let totW=0,totOT=0,totLate=0,totAbs=0,totPaid=0,totH=0;

    for(let d=1;d<=days;d++){

      const att=attend[attKey(aY,aM,d,emp.id)]||{};

    if(isSingle){

        (s==='p'?'有休':'—');
      const outCell=s==='w'?(!att.out?`<span class="missing" onclick="activateInput(this,${emp.id},${d},'out','19:30')">未打刻 ✏</span>`:
        `<input class="time-input" type="text" value="${att.out}" placeholder="19:30" onblur="saveTime(${emp.id},${d},'out',this)" onkeydown="if(event.key==='Enter')this.blur()">${mb('out')}`):
        '—';
      const hasMissing=s==='w'&&(!att.in||!att.out);
      rows+=`<tr${rowBg||hasMissing?' style="background:'+(isT?'#eef5fd':hasMissing?'#fffbeb':'')+(hasMissing?';outline:1px solid #f59e0b':'')+';"':''}>
        <td>${aM+1}/${d}</td><td>${dowStr}</td>
        <td><span class="badge-${s}" style="cursor:default">${s==='w'?'出':s==='p'?'有':'休'}</span></td>
        <td>${inCell}</td><td>${outCell}</td>
        <td>${wStr}</td><td>${otStr}</td><td>${statusBadge(st)}</td>
      </tr>`;
    }else{
      const cells=showEmps.map(function(emp){
        const s=getShift(aY,aM,d,emp.id);
        const att=attend[attKey(aY,aM,d,emp.id)]||{};
        const st=getStatus(aY,aM,d,emp,s,att);
        if(s==='o')return'<td><span style="color:#ccc;font-size:11px">—</span></td>';
        if(s==='p')return'<td><span class="att-badge ab-paid">有休</span></td>';
        const hasMissing=!att.in||!att.out;
        const cellBg=hasMissing?'background:#fffbeb;border:1px solid #f59e0b;':'';
        const inStr=att.in||'<span style="color:#f59e0b;font-weight:600">未</span>';
        const outStr=att.out||'<span style="color:#f59e0b;font-weight:600">未</span>';
        return`<td style="white-space:nowrap;${cellBg}"><span style="font-size:11px">${inStr}〜${outStr}</span><br>${statusBadge(st)}</td>`;
      }).join('');
      rows+=`<tr${rowBg}><td>${aM+1}/${d}</td><td>${dowStr}</td>${cells}<td></td></tr>`;
    }
  }
  document.getElementById('attend-body').innerHTML=rows;
}

function activateInput(span,eid,d,field,ph){
  const inp=document.createElement('input');
  inp.className='time-input';inp.type='text';inp.placeholder=ph;
  inp.onblur=function(){saveTime(eid,d,field,this);};
  inp.onkeydown=function(e){if(e.key==='Enter')this.blur();};
  span.parentNode.replaceChild(inp,span);inp.focus();
}
function saveTime(eid,d,field,el){
  let val=el.value.trim();
  if(/^\d{3,4}$/.test(val)){val=val.length===3?'0'+val:val;val=val.slice(0,2)+':'+val.slice(2);}
  if(val&&!/^\d{1,2}:\d{2}$/.test(val)){el.style.borderColor='#e74c3c';return;}
  if(val&&val.indexOf(':')===1)val='0'+val;
  el.value=val;el.style.borderColor='';
  const k=attKey(aY,aM,d,eid);
  if(!attend[k])attend[k]={};
  if(val){attend[k][field]=val;if(!attend[k].manual)attend[k].manual={};attend[k].manual[field]=true;}
  else{delete attend[k][field];if(attend[k].manual)delete attend[k].manual[field];}
  scheduleSave();scheduleCloud();
  setTimeout(function(){renderAttend();},100);
}

function syncFromSheets(){
  if(!sheetsUrl){showSheetsStatus('URLを設定してください','err');return;}
  showSheetsStatus('取得中...','ok');
  fetch(sheetsUrl+'?action=loadClock&t='+Date.now(),{credentials:'omit'})
    .then(function(r){return r.json();})
    .then(function(data){
      let cnt=0;
      Object.entries(data).forEach(function([k,v]){
        if(k&&(v.in||v.out)){
          // 旧キー形式 empId_y_m_d → 新キー形式 y_m_d_empId
          const p=k.split('_');
          if(p.length===4){
            const newKey=p[1]+'_'+p[2]+'_'+p[3]+'_'+p[0];
            const existing=attend[newKey]||{};
            const mf=existing.manual||{};
            if(!attend[newKey])attend[newKey]={};
            if(!mf.in&&v.in)attend[newKey].in=v.in;
            if(!mf.out&&v.out)attend[newKey].out=v.out;
            cnt++;
          }
        }
      });
      scheduleSave();renderAttend();
      showSheetsStatus(cnt+'件の打刻データを取得しました','ok');
    })
    .catch(function(){showSheetsStatus('取得に失敗しました','err');});
}
function showSheetsStatus(msg,type){
  const el=document.getElementById('sheets-status');
  el.textContent=msg;el.className='sheets-status '+type;
  setTimeout(function(){el.className='sheets-status';},4000);
}
function saveURL(){
  sheetsUrl=document.getElementById('sheets-url-input').value.trim();
  localSave();showSheetsStatus('URLを保存しました','ok');
}

// ===== 給与計算 =====
let pY=TODAY.getFullYear(),pM=TODAY.getMonth();
function chPayMonth(d){pM+=d;if(pM<0){pM=11;pY--;}if(pM>11){pM=0;pY++;}renderPayroll();}

function payrollDates(y,m){
  let py=y,pm=m-1;if(pm<0){pm=11;py--;}
  const dates=[];
  for(let d=16;d<=daysInMonth(py,pm);d++)dates.push({y:py,m:pm,d});
  for(let d=1;d<=15;d++)dates.push({y,m,d});
  return dates;
}

function renderPayroll(){
  document.getElementById('payroll-label').textContent=pY+'年'+(pM+1)+'月';
  const pdates=payrollDates(pY,pM);
  const from=pdates[0],to=pdates[pdates.length-1];
  document.getElementById('payroll-period-bar').textContent=
    `給与計算期間：${from.y}年${from.m+1}月${from.d}日 〜 ${to.y}年${to.m+1}月${to.d}日（${pY}年${pM+1}月25日払い）`;

  let rows='',totPlanned=0,totWork=0,totPaid=0,totAbs=0,totOT=0,totLate=0,totPre=0,totActOT=0;
  EMPS.forEach(function(emp){
    let planned=0,work=0,paid=0,abs=0,ot=0,late=0,pre=0,actOT=0,actWorked=0;
    let wkDay=0,holDay=0;
    pdates.forEach(function(dt){
      initMonthIfNeeded(dt.y,dt.m);
      const s=getShift(dt.y,dt.m,dt.d,emp.id);
      const att=attend[attKey(dt.y,dt.m,dt.d,emp.id)]||{};
      if(s==='p'){paid++;return;}
      if(s==='o')return;
      planned++;
      const inMin=timeToMin(att.in),outMin=timeToMin(att.out);
      if(inMin===null||outMin===null){abs++;return;}
      work++;
      const rule=getRule(dt.y,dt.m,dt.d,emp);
      const fixIn=Math.max(inMin,timeToMin(rule.startH));
      const gross=outMin-fixIn-rule.breakMin;
      const worked=Math.max(0,gross);
      const extraOT=rule.part?0:Math.max(0,outMin-timeToMin(rule.endH));
      actWorked+=worked;actOT+=extraOT;
      const lateBase=timeToMin(rule.startH);
      if(inMin>lateBase+1)late++;
      if(!emp.part){
        if(isHol(dt.y,dt.m,dt.d))holDay++;else wkDay++;
      }
    });
    if(!emp.part){
      pre=(wkDay*8+holDay*7)*60;
      actOT=Math.max(0,actWorked-pre);
      totPre+=pre;totActOT+=actOT;
    }
    const diffMark=(!emp.part&&work>0&&planned!==work)?`<span title="予定${planned}日に対して実績${work}日" style="color:#C0392B;margin-left:4px;cursor:help">⚠</span>`:'';
    const prCell=emp.part?'<span style="color:#bbb">—</span>':(pre>0?Math.floor(pre/60)+'h':'—');
    const aoCell=emp.part?'<span style="color:#bbb">—</span>':actOT>0?`<span class="ot-val">${Math.floor(actOT/60)}h${actOT%60>0?actOT%60+'m':''}</span>`:'<span style="color:#bbb">—</span>';
    const totalMin=pre+actOT;
    const totalCell=emp.part?'<span style="color:#bbb">—</span>':actWorked>0?`<span style="font-weight:700;color:#0C447C">${Math.floor(totalMin/60)}h${totalMin%60>0?totalMin%60+'m':''}</span>`:'<span style="color:#bbb">打刻なし</span>';
    const otCell=emp.part?'<span style="color:#bbb">—</span>':ot>0?`<span class="ot-val">${Math.floor(ot/60)}h${ot%60>0?ot%60+'m':''}</span>`:'<span style="color:#bbb">—</span>';
    const deemedCell=emp.part?'<span style="color:#bbb">—</span>':work+' <span style="font-size:11px;color:#888">h</span>';
    totPlanned+=planned;totWork+=work;totPaid+=paid;totAbs+=abs;totLate+=late;
    const rowBg=(!emp.part&&work>0&&planned!==work)?'style="background:#fff8f0"':'';
    rows+=`<tr ${rowBg}>
      <td><div class="emp-row">
        <div class="avatar" style="background:${emp.bg};color:${emp.tc}">${ini(emp)}</div>
        <span class="emp-name">${emp.name}${emp.part?'<span style="font-size:9px;background:#fdf3d4;color:#5a3e00;border-radius:3px;padding:1px 4px;margin-left:4px">P</span>':''}</span>
      </div></td>
      <td class="num">${planned} <span style="font-size:11px;color:#888">日</span></td>
      <td class="num">${work} <span style="font-size:11px;color:#888">日</span>${diffMark}</td>
      <td class="num">${paid>0?paid+' <span style="font-size:11px;color:#085041">日</span>':'<span style="color:#bbb">—</span>'}</td>
      <td class="num">${abs>0?'<span style="color:#C0392B">'+abs+'</span> <span style="font-size:11px;color:#888">日</span>':'<span style="color:#bbb">—</span>'}</td>
      <td class="num">${deemedCell}</td>
      <td class="num">${otCell}</td>
      <td class="num">${prCell}</td>
      <td class="num">${aoCell}</td>
      <td class="num">${totalCell}</td>
      <td class="num">${late>0?'<span style="color:#C0392B">'+late+'</span>':'<span style="color:#bbb">—</span>'}</td>
    </tr>`;
  });
  document.getElementById('payroll-body').innerHTML=rows;
  document.getElementById('payroll-note').textContent=
    '【正社員】所定9:00〜19:00（日祝18:00）休憩2h／みなし残業：19:00〜19:30含む／追加残業：19:30超過分　【パート】大西：8:30〜13:00（4.5h）／田中（菜）：9:00〜13:00（4h）残業なし';

  // メモ
  const memoKey=pY+'_'+pM;
  const ta=document.getElementById('memo-area');
  ta.value=memos[memoKey]||'';
  document.getElementById('memo-period').textContent='（'+pY+'年'+(pM+1)+'月25日払い分）';
  ta.oninput=function(){
    clearTimeout(ta._t);
    ta._t=setTimeout(function(){
      memos[memoKey]=ta.value;
      scheduleSave();scheduleCloud();
      const s=document.getElementById('memo-saved');
      s.textContent='✓ 保存';s.className='memo-saved ok';
      setTimeout(function(){s.textContent='';s.className='memo-saved';},2000);
    },1000);
  };
}
function clearMemo(){
  if(!confirm('消去しますか？'))return;
  const ta=document.getElementById('memo-area');ta.value='';
  memos[pY+'_'+pM]='';scheduleSave();scheduleCloud();
}

// ===== 印刷用 =====
let prY=TODAY.getFullYear(),prM=TODAY.getMonth();
function chPrintMonth(d){prM+=d;if(prM<0){prM=11;prY--;}if(prM>11){prM=0;prY++;}renderPrint();}
function renderPrint(){
  initMonthIfNeeded(prY,prM);
  const days=daysInMonth(prY,prM);
  const startDow=new Date(prY,prM,1).getDay();
  const isCurr=prY===TODAY.getFullYear()&&prM===TODAY.getMonth();
  document.getElementById('print-label').textContent=prY+'年'+(prM+1)+'月';
  let hdr='<tr><th class="pt-name">氏名</th>';
  for(let d=1;d<=days;d++){
    const dow=(startDow+d-1)%7;
    const isT=isCurr&&d===TODAY.getDate();
    const cls=isT?'pt-today':isHol(prY,prM,d)?'pt-sun':isSat(prY,prM,d)?'pt-sat':'';
    const dowStr=isHol(prY,prM,d)&&dow!==0?DOW[dow]+'<br><span style="font-size:8px">祝</span>':DOW[dow];
    hdr+=`<th${cls?' class="'+cls+'"':''}>${d}<br>${dowStr}</th>`;
  }
  hdr+='<th>出勤</th><th>有休</th><th>休</th></tr>';
  const dayCnt=Array(days+1).fill(0);
  let bodyRows='';
  const cards=EMPS.map(function(emp){
    let wk=0,pd=0,of=0,cells='';
    for(let d=1;d<=days;d++){
      const s=getShift(prY,prM,d,emp.id);
      const dow=(startDow+d-1)%7;
      const isT=isCurr&&d===TODAY.getDate();
      const tdCls=isT?'pt-today':isHol(prY,prM,d)?'pt-sun':isSat(prY,prM,d)?'pt-sat':'';
      if(s==='w'){wk++;dayCnt[d]++;}else if(s==='p')pd++;else of++;
      const badge=s==='w'?`<span class="pt-w" style="background:${emp.bg};color:${emp.tc}">出</span>`:
                  s==='p'?`<span class="pt-p">有</span>`:`<span class="pt-o">休</span>`;
      cells+=`<td${tdCls?' class="'+tdCls+'"':''}>${badge}</td>`;
    }
    bodyRows+=`<tr><td class="pt-name" style="--ec:${emp.bg}">
      <div style="display:flex;align-items:center;gap:6px">
        <div class="avatar" style="width:22px;height:22px;font-size:9px;background:${emp.bg};color:${emp.tc}">${ini(emp)}</div>
        <span style="font-size:11px;font-weight:600">${emp.name}</span>
      </div></td>${cells}
      <td style="font-weight:700;color:#0C447C;font-size:12px">${wk}</td>
      <td style="font-weight:700;color:#085041;font-size:12px">${pd>0?pd:'—'}</td>
      <td style="color:#aaa;font-size:12px">${of}</td></tr>`;
    return{emp,wk,pd,of};
  });
  let sumRow='<tr class="sum-row"><td class="pt-name">出勤人数</td>';
  for(let d=1;d<=days;d++)sumRow+=`<td><span style="font-size:11px">${dayCnt[d]}</span></td>`;
  sumRow+='<td colspan="3"></td></tr>';
  const sumCards=cards.map(function(c){
    return`<div class="psc">
      <div class="psc-name">${c.emp.name}</div>
      <div class="psc-row"><span>出勤</span><span class="psc-val">${c.wk}日</span></div>
      ${c.pd>0?'<div class="psc-row"><span>有休</span><span style="font-weight:700;color:#085041">'+c.pd+'日</span></div>':''}
      <div class="psc-row"><span>休日</span><span style="color:#aaa">${c.of}日</span></div>
    </div>`;
  }).join('');
  document.getElementById('print-area').innerHTML=
    `<div style="font-size:18px;font-weight:700;text-align:center;margin-bottom:4px">シフト表</div>
     <div style="font-size:12px;text-align:center;color:#888;margin-bottom:1.25rem">${prY}年${prM+1}月</div>
     <div style="overflow-x:auto"><table class="print-table"><thead>${hdr}</thead><tbody>${bodyRows}${sumRow}</tbody></table></div>
     <div class="print-sum">${sumCards}</div>
     <div style="font-size:10px;color:#bbb;text-align:right;margin-top:8px">出力日：${TODAY.getFullYear()}年${TODAY.getMonth()+1}月${TODAY.getDate()}日</div>`;
}

// ===== 初期化 =====
EMPS.forEach(function(e){fixed[e.id]=[0,6];});
localLoad();
EMPS.forEach(function(e){
  document.getElementById('att-emp').add(new Option(e.name,e.id));
});
document.getElementById('btn-save').onclick=async function(){
  setBadge('☁ 保存中...','#dceefb','#0C447C');
  try{
    const data=JSON.stringify({shifts:shifts,attend:attend,fixed:fixed,memos:memos});
    await fetch(sheetsUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'saveAll',data:data})});
    setBadge('● 同期済み','#dff2d4','#27500A');
  }catch(e){setBadge('⚠ 保存失敗','#fde4e4','#7A1F1F');}
};
document.getElementById('btn-load').onclick=function(){
  cloudLoad().then(function(ok){
    if(ok){renderAll();alert('取得しました');}
    else{alert('データがありませんでした');}
  });
};
function renderAll(){
  renderShift();
  const activeTab=document.querySelector('.tab.active');
  if(activeTab){
    const name=activeTab.getAttribute('onclick').match(/showTab\('(\w+)'/);
    if(name){
      if(name[1]==='attend')renderAttend();
      else if(name[1]==='payroll')renderPayroll();
      else if(name[1]==='print')renderPrint();
    }
  }
}
renderShift();

// 起動時にクラウドから自動取得
if(sheetsUrl){
  cloudLoad().then(function(ok){if(ok)renderAll();});
}
</script>
